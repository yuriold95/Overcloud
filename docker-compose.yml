# Local development: MongoDB (single-node replica set, so multi-document transactions work) + API.
# Works with `docker compose` and `podman compose`.
services:
  mongo:
    image: docker.io/library/mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ENV: local
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: overclouded
      AUTH_MODE: dev
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:?run make setup to generate .env}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mongo-data:
